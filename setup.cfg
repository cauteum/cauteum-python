[metadata]
name = cauteum
version = 0.1.0b1
description = Python SDK for the cauteum gateway control plane
license = Apache-2.0
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    httpx>=0.27
    grpcio>=1.70,<2
    protobuf>=5.29,<6

[options.extras_require]
dev =
    pytest>=8
    grpcio-tools==1.70.0

[options.packages.find]
include =
    cauteum*
