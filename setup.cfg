[metadata]
name = whaleshell
version = 0.1.0b1
description = Python SDK for the whaleshell gateway control plane
license = Apache-2.0
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    httpx>=0.27

[options.extras_require]
dev =
    pytest>=8

[options.packages.find]
include =
    whaleshell*
