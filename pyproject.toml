[project]
name = "cautem"
version = "0.1.6"
description = "Python SDK for the cautem gateway control plane"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
  "grpcio>=1.70,<2",
  "protobuf>=5.29,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "grpcio-tools==1.70.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cautem*"]
